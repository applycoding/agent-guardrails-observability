name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
      - name: Eval gate
        run: python -m agentops.evals evals/dataset.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Red-team gate
        run: python -m agentops.redteam redteam/attacks.jsonl | tee -a "$GITHUB_STEP_SUMMARY"
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t agent-guardrails-observability .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 agent-guardrails-observability
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/chat -H 'content-type: application/json' -d '{"message":"Create a ticket for smoke test"}'
